name: ci-sonarcloud
on:
  pull_request:
    branches:
      - develop

jobs:
  build:
    name: Build and analyze on SonarCloud
    runs-on: ubuntu-latest
    steps:
      - name: Set up Go
      - uses: actions/setup-go@v2
        with:
          go-version: 1.24.6
      - name: Run tests and generate coverage
      - run: go test -coverprofile=coverage.out
